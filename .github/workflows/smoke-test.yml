name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # setup.sh also grants X access and builds; CI only needs the .env it would
      # generate, since the smoke test builds the images itself (--no-cache).
      - name: Generate .env
        run: |
          sed -e "s|__HOME__|$HOME|g" \
              -e "s|^HOST_UID=.*|HOST_UID=$(id -u)|" \
              -e "s|^HOST_GID=.*|HOST_GID=$(id -g)|" \
              .env.example > .env
          . ./.env
          mkdir -p "$CONNECTIQ_DATA_DIR" "$WORKSPACES_DIR" "$THEIA_CONFIG_DIR"

      # Builds both images from scratch, checks the GTK binaries' shared libraries,
      # the extension unpack, and that the Theia backend boots and serves HTTP.
      # The simulator ldd check self-skips (no SDK installed here); the X11/GUI and
      # debug-path checks are manual by design - see the script header.
      - name: Run smoke test
        run: ./test/smoke-test.sh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-build-log
          path: /tmp/smoke-test-build.log
          if-no-files-found: ignore
